name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgresql+psycopg://ecommerce_etl:ci_only_password@localhost:5432/ecommerce_dw
      PGPASSWORD: ci_only_password
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ecommerce_dw
          POSTGRES_USER: ecommerce_etl
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ecommerce_etl -d ecommerce_dw"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: psql -h localhost -U ecommerce_etl -d ecommerce_dw -f sql/schema.sql
      - run: python -m pytest
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci --prefix dashboard
      - run: npm test --prefix dashboard
      - run: npm run build --prefix dashboard
